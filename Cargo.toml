[workspace]
resolver = "2"
members = [
    "crates/dingooemu-core",
    "crates/dingooemu",
    "crates/dingooemu-libretro",
]
# The libretro buildbot runs a bare `cargo build --release --target <triple>` at
# the repo root. Restrict the default build set to the libretro core so the CI
# does not try to cross-compile the standalone GUI binary (minifb/rodio, which
# need X11/ALSA). Explicit `-p` / `--workspace` selections are unaffected.
default-members = ["crates/dingooemu-libretro"]

[workspace.package]
version = "0.2.0"
edition = "2021"
description = "A Dingoo A320 emulator written in Rust"
license = "BSD-3-Clause"

[workspace.dependencies]
dingooemu-core = { path = "crates/dingooemu-core" }
anyhow = "=1.0.104"
thiserror = "=2.0.20"
log = "=0.4.33"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
crc32fast = "=1.5.0"
bincode = "=1.3.3"
lz4_flex = "=0.14.0"
image = "=0.25.10"
clap = { version = "=4.6.6", features = ["derive"] }
minifb = "=0.28.0"
rodio = { version = "=0.22.2", features = ["mp3"] }
env_logger = "=0.11.11"
cranelift = "=0.131.3"
cranelift-jit = "=0.131.3"
cranelift-module = "=0.131.3"
cranelift-native = "=0.131.3"

[profile.release]
opt-level = 3
lto = true
strip = true
