[workspace]
resolver = "2"
members = [
    "crates/dingooemu-core",
    "crates/dingooemu",
    "crates/dingooemu-libretro",
]
# The libretro buildbot runs a bare `cargo build --release --target <triple>` at
# the repo root. Restrict the default build set to the libretro core so the CI
# does not try to cross-compile the standalone GUI binary (minifb/rodio, which
# need X11/ALSA). Explicit `-p` / `--workspace` selections are unaffected.
default-members = ["crates/dingooemu-libretro"]

[workspace.package]
version = "0.1.0"
edition = "2021"
description = "A Dingoo A320 emulator written in Rust"
license = "BSD-3-Clause"

[workspace.dependencies]
dingooemu-core = { path = "crates/dingooemu-core" }
anyhow = "=1.0.100"
thiserror = "=2.0.19"
log = "=0.4.29"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.148"
crc32fast = "=1.5.0"
image = "=0.25.10"
clap = { version = "=4.5.53", features = ["derive"] }
minifb = "=0.28.0"
rodio = { version = "=0.22.0", features = ["mp3"] }
env_logger = "=0.11.11"

[profile.release]
opt-level = 3
lto = true
strip = true
